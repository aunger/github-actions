name: Strip session bylines

# Runs this repository's own strip-session-bylines action over each issue, pull
# request, comment and review as it is written or edited.
#
# The checkout takes the default branch by name, so the script that runs with
# write permissions is the current reviewed one, never one a pull request
# branch supplies, and never a stale base commit. privileged-checkout-guard
# accepts this ref. That holds only while this file itself comes from the
# default branch, which review and review-comment runs do not guarantee: see
# the docstring of strip-session-bylines/strip_session_bylines.py.
#
# PR descriptions use pull_request_target, which reads this workflow from the
# default branch (whatever the PR's base), gets a write token on fork pull
# requests, and runs when a pull request has a merge conflict. The review
# events have no _target variant: on a fork pull request their token is
# read-only, so bylines in reviews and review comments there are left in place
# (the action logs a warning).
#
# A workflow_dispatch run cleans one whole issue or pull request, named by
# number: its description and every comment and review on it. That catches
# bylines written before this workflow existed, or ones it missed.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or pull request number to clean
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

# One run at a time per event type and item, so the creation and edit runs of
# one comment do not overlap. GitHub keeps at most one pending run per group: a
# newer event cancels the pending one (it shows as a cancelled run). A manual
# run has a group of its own, so it can overlap event runs on the same issue or
# pull request. Both are harmless because the script, in both modes,
# re-fetches each body just before writing it (see _strip_item in the script
# for what that does not cover).
concurrency:
  group: >-
    strip-session-bylines-${{ github.event_name }}-${{ inputs.number
    || github.event.comment.id || github.event.review.id
    || github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  strip:
    # Skip the runner entirely for text with no byline. A review is judged by
    # its own body only, so a body-less approval does not fall through to the
    # PR description. A manual run always goes ahead. The action's own edits
    # need no check here: writes made with GITHUB_TOKEN start no workflow runs.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'pull_request_review'
      && contains(github.event.review.body, 'claude.ai/code')
      || github.event_name != 'pull_request_review'
      && contains(github.event.comment.body || github.event.pull_request.body
      || github.event.issue.body, 'claude.ai/code')
    runs-on: ubuntu-latest
    steps:
      # Pinned by SHA because this job holds write scopes. Dependabot's
      # github-actions entry updates the pin and the version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            strip-session-bylines
            shared

      - name: Strip session-URL bylines
        uses: ./strip-session-bylines
        with:
          number: ${{ inputs.number }}
