name: Strip Claude session-URL bylines
description: >-
  Remove Claude session-URL bylines (https://claude.ai/code/session_...) from
  the issue, pull request, comment or review that triggered the workflow, in
  place, through the GitHub REST API. Given a number, it instead cleans that
  whole issue or pull request: its description and every comment and review.

# Call it from a workflow triggered by these events, with these permissions:
#
#   on:
#     issues: {types: [opened, edited]}
#     issue_comment: {types: [created, edited]}
#     pull_request: {types: [opened, edited]}   # or pull_request_target
#     pull_request_review_comment: {types: [created, edited]}
#     pull_request_review: {types: [submitted, edited]}
#   permissions:
#     issues: write
#     pull-requests: write
#
# To clean bylines written before the workflow existed, or missed by it, give
# the `number` input from a workflow_dispatch run, whose payload names no item:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         number: {description: Issue or pull request number, required: true, type: number}
#   ...
#       with:
#         number: ${{ inputs.number }}
#
# With a number, the event is ignored, and a bad number or a failed read or
# write fails the step; without one, the step never fails.
#
# This repository's .github/workflows/strip-session-bylines.yml is a worked
# example that runs a local copy with pull_request_target, a default-branch
# checkout and a per-item concurrency group.
#
# The action runs its own copy of the script, pinned by the commit the caller's
# `uses:` names, and the caller needs no checkout. On the pull_request,
# pull_request_review and pull_request_review_comment events that is no
# boundary: GitHub reads the calling workflow from the pull request's merge ref,
# so a pull request can repoint the `uses:` line or add a step of its own.

inputs:
  github-token:
    description: A token with issues and pull-requests write access.
    required: false
    default: ${{ github.token }}
  number:
    description: >-
      An issue or pull request number. When given, the triggering event is
      ignored, and bylines are stripped from that item's description, every
      issue comment and, for a pull request, every review comment and review.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The edits this action makes are made by github-actions[bot]; skipping that
    # actor keeps a bot edit from being processed again.
    # The script uses only the standard library, so nothing is installed first.
    - name: Strip session-URL bylines
      if: github.actor != 'github-actions[bot]'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        STRIP_NUMBER: ${{ inputs.number }}
      run: python3 "$GITHUB_ACTION_PATH/strip_session_bylines.py"
